version: '3.8'

services:
  # === 1. ฝั่ง APACHE ===
  db-apache:
    image: mariadb:10.6
    container_name: db-apache
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: php-app
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_apache_data:/var/lib/mysql

  web-apache:
    image: php:8.1-apache
    container_name: web-apache
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./src:/var/www/html
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"
    depends_on:
      - db-apache

  phpmyadmin-apache:
    image: phpmyadmin:latest
    container_name: pma-apache
    restart: always
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db-apache
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db-apache

  # === 2. ฝั่ง NGINX ===
  db-nginx:
    image: mariadb:10.6
    container_name: db-nginx
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: php-app-nginx
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_nginx_data:/var/lib/mysql

  web-nginx:
    image: nginx:alpine
    container_name: web-nginx
    restart: always
    ports:
      - "82:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-apache
      - db-nginx

  phpmyadmin-nginx:
    image: phpmyadmin:latest
    container_name: pma-nginx
    restart: always
    ports:
      - "8084:80"
    environment:
      PMA_HOST: db-nginx
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db-nginx

volumes:
  db_apache_data:
  db_nginx_data: